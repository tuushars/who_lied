            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

<script>
        // Character counter logic
        const input = document.getElementById('clue-input');
        const counter = document.getElementById('char-count');
        
        input.addEventListener('input', (e) => {
            const length = e.target.value.length;
            counter.textContent = `${length}/30`;
            if (length >= 30) {
                counter.classList.add('text-primary-container');
            } else {
                counter.classList.remove('text-primary-container');
            }
        });

        // Timer countdown logic
        let timeLeft = 45;
        const timerText = document.getElementById('timer-text');
        const timerCircle = document.querySelector('.timer-glow');
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerText.textContent = timeLeft;
            
            // Update dash offset
            const offset = (552.92 * (45 - timeLeft)) / 45;
            timerCircle.style.strokeDashoffset = offset;

            // Panic effects
            if (timeLeft <= 10) {
                timerText.classList.add('text-error', 'animate-shake');
                timerCircle.setAttribute('stroke', '#ffb4ab');
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.textContent = "!";
            }
        }, 1000);
    </script>
