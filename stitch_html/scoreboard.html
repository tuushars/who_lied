<script>
        // Atmospheric Micro-interactions
        document.querySelectorAll('.chunky-button').forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.transform = 'scale(1.02)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Simple score animation on load
        window.addEventListener('load', () => {
            const scores = document.querySelectorAll('.text-headline-md');
            scores.forEach(score => {
                const finalValue = parseInt(score.innerText);
                if (!isNaN(finalValue)) {
                    let start = 0;
                    const duration = 1000;
                    const increment = finalValue / (duration / 16);
                    const timer = setInterval(() => {
                        start += increment;
                        if (start >= finalValue) {
                            score.innerText = finalValue;
                            clearInterval(timer);
                        } else {
                            score.innerText = Math.floor(start);
                        }
                    }, 16);
                }
            });
        });
    </script>
