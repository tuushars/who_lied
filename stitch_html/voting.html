<script>
        // Micro-interaction for player selection
        const playerButtons = document.querySelectorAll('main grid button');
        playerButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active classes from all
                playerButtons.forEach(b => {
                    b.classList.remove('border-primary', 'suspect-glow', 'scale-105', 'z-10');
                    b.classList.add('border-outline');
                    // Remove suspect tag
                    const tag = b.querySelector('.absolute.-top-3');
                    if(tag) tag.remove();
                    // Remove pulse
                    const pulse = b.querySelector('.animate-pulse-neon');
                    if(pulse) pulse.remove();
                });

                // Add to clicked
                btn.classList.add('border-primary', 'suspect-glow', 'scale-105', 'z-10');
                btn.classList.remove('border-outline');
                
                // Add Suspect tag
                const tag = document.createElement('div');
                tag.className = "absolute -top-3 -right-2 bg-primary text-on-primary text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter shadow-lg animate-bounce";
                tag.innerText = "Suspect";
                btn.appendChild(tag);

                // Add Pulse
                const pulse = document.createElement('div');
                pulse.className = "absolute inset-0 border-2 border-primary rounded-xl animate-pulse-neon pointer-events-none";
                btn.appendChild(pulse);
            });
        });
    </script>
